name: Public artifact safety

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public repository
        run: bash scripts/safety/validate_public_repo.sh
      - name: Validate documentation links
        run: python3 scripts/safety/check_markdown_links.py --repo .
      - name: Validate documentation governance
        run: python3 scripts/safety/check_documentation_governance.py --repo .
      - name: Run documentation governance tests
        run: python3 -m unittest scripts.tests.test_documentation_governance
      - name: Run Test 19 synthetic qualification tests
        run: python3 -m unittest scripts.tests.test_test19_cxr_tools
